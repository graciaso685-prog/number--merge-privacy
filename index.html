<style>
/* Layout: one screen per tab (Accueil, Projets, Le studio, Contact). Projets = grid of app icons; tapping one opens that project's own screen. */
:root {
  --bg: #f4f8fd; --surface: #ffffff; --ink: #0c2340; --muted: #4d6382; --line: #d5e1f0;
  --brand: #0d47a1; --brand-ink: #ffffff; --sun: #ffd54f; --sun-ink: #3b2a00;
  --board: #0d47a1; --cell: #5f93c6;
  --t2: #bbdefb; --t2i: #0d47a1; --t4: #90caf9; --t4i: #0d47a1; --t8: #64b5f6; --t8i: #ffffff;
  --t16: #42a5f5; --t16i: #ffffff; --t32: #2196f3; --t32i: #ffffff; --t64: #1e88e5; --t64i: #ffffff;
  --font-display: "Space Grotesk", "Segoe UI", Arial, sans-serif;
  --font-body: "Inter", "Segoe UI", Arial, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0a1626; --surface: #112038; --ink: #e8f0fb; --muted: #9bb0cc; --line: #223756;
    --brand: #64b5f6; --brand-ink: #08203d; --board: #0b2a52; --cell: #1d4676;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0a1626; --surface: #112038; --ink: #e8f0fb; --muted: #9bb0cc; --line: #223756;
  --brand: #64b5f6; --brand-ink: #08203d; --board: #0b2a52; --cell: #1d4676;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { min-height: 100%; }
body {
  background: var(--bg); color: var(--ink); font: 16px/1.6 var(--font-body);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0;
}
a { color: var(--brand); }
a:focus-visible, button:focus-visible { outline: 3px solid var(--sun); outline-offset: 2px; }
.wrap { max-width: 1040px; margin: 0 auto; min-height: 100vh; display: flex; flex-direction: column; }
main { flex: 1; min-width: 0; }
h1, h2, h3 { font-family: var(--font-display); line-height: 1.1; text-wrap: balance; margin: 0; }

header.top { display: flex; align-items: center; justify-content: space-between; gap: 12px 20px; padding-block: 16px; flex-wrap: wrap; border-bottom: 1px solid var(--line); }
.logo { font-family: var(--font-display); font-weight: 700; font-size: 24px; letter-spacing: -0.02em; color: var(--ink); text-decoration: none; }
.logo b { color: var(--brand); }
nav.tabs { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
nav.tabs a { color: var(--muted); text-decoration: none; font-weight: 600; font-size: 15px; padding: 8px 14px; border-radius: 999px; }
nav.tabs a:hover { color: var(--ink); }
nav.tabs a[aria-current="page"] { background: var(--brand); color: var(--brand-ink); }
.lang { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; overflow: hidden; margin-left: 8px; }
.lang button { border: 0; background: transparent; color: var(--muted); font: 600 13px var(--font-body); padding: 6px 12px; cursor: pointer; }
.lang button[aria-pressed="true"] { background: var(--sun); color: var(--sun-ink); }

.view { padding-block: 40px 56px; }
.eyebrow { font: 600 13px var(--font-body); letter-spacing: 0.12em; text-transform: uppercase; color: var(--brand); margin-bottom: 14px; }
.view > h2, .page-h { font-size: clamp(30px, 5vw, 46px); letter-spacing: -0.02em; margin-bottom: 12px; }
.sub { color: var(--muted); max-width: 56ch; margin: 0 0 28px; }

/* Accueil */
.hero { display: grid; grid-template-columns: 1.1fr 0.9fr; gap: 40px; align-items: center; }
.hero h1 { font-size: clamp(38px, 6vw, 64px); letter-spacing: -0.03em; }
.hero h1 em { font-style: normal; background: var(--sun); color: var(--sun-ink); padding: 0 10px; border-radius: 10px; }
.hero p.lead { color: var(--muted); font-size: 18px; max-width: 46ch; margin: 20px 0 28px; }
.btn { display: inline-flex; align-items: center; gap: 8px; background: var(--brand); color: var(--brand-ink); text-decoration: none; font-weight: 600; padding: 13px 22px; border-radius: 12px; box-shadow: 0 4px 0 rgba(0,0,0,.22); transition: transform .1s, box-shadow .1s; border: 0; font-size: 16px; cursor: pointer; font-family: var(--font-body); }
.btn:active { transform: translateY(3px); box-shadow: 0 1px 0 rgba(0,0,0,.22); }
.btn.sun { background: var(--sun); color: var(--sun-ink); }
.actions { display: flex; flex-wrap: wrap; gap: 12px; }
.board { background: var(--board); border-radius: 22px; padding: 12px; display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; max-width: 380px; margin-left: auto; width: 100%; box-shadow: 0 14px 0 -6px rgba(0,0,0,.18); }
.cell { aspect-ratio: 1; border-radius: 12px; background: var(--cell); display: grid; place-items: center; font: 700 clamp(18px, 4vw, 28px) var(--font-display); }
.cell.v2 { background: var(--t2); color: var(--t2i); } .cell.v4 { background: var(--t4); color: var(--t4i); }
.cell.v8 { background: var(--t8); color: var(--t8i); } .cell.v16 { background: var(--t16); color: var(--t16i); }
.cell.v32 { background: var(--t32); color: var(--t32i); } .cell.v64 { background: var(--t64); color: var(--t64i); }
.cell.v128 { background: var(--sun); color: var(--sun-ink); }
@media (prefers-reduced-motion: no-preference) { .cell.pop { animation: pop .35s ease; } }
@keyframes pop { 0% { transform: scale(.6); } 70% { transform: scale(1.08); } 100% { transform: scale(1); } }

/* Projets : icônes */
.icons { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 28px 20px; margin-top: 12px; }
.icon-btn { display: flex; flex-direction: column; align-items: center; gap: 12px; text-decoration: none; color: var(--ink); text-align: center; }
.icon-btn svg { width: 104px; height: 104px; border-radius: 24px; box-shadow: 0 6px 0 rgba(0,0,0,.18); transition: transform .12s; }
.icon-btn:hover svg { transform: translateY(-3px); }
.icon-btn:active svg { transform: translateY(2px); }
.icon-btn span { font: 600 16px var(--font-display); }

/* Détail projet */
.back { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); text-decoration: none; font-weight: 600; font-size: 15px; margin-bottom: 24px; }
.back:hover { color: var(--ink); }
.detail { display: grid; grid-template-columns: 200px 1fr; gap: 36px; align-items: start; }
.detail .big svg { width: 100%; max-width: 200px; aspect-ratio: 1; height: auto; border-radius: 44px; box-shadow: 0 10px 0 rgba(0,0,0,.18); }
.detail h2 { font-size: clamp(28px, 4.4vw, 42px); letter-spacing: -0.02em; margin-bottom: 4px; }
.detail .by { color: var(--muted); margin: 0 0 18px; }
.detail p.desc { color: var(--ink); max-width: 60ch; margin: 0 0 18px; }
.tags { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 24px; }
.tags span { border: 1px solid var(--line); border-radius: 999px; padding: 4px 12px; font-size: 13px; color: var(--muted); }
.feat { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; margin: 8px 0 28px; }
.feat div { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 18px; min-width: 0; }
.feat h3 { font-size: 17px; margin-bottom: 6px; }
.feat p { margin: 0; color: var(--muted); font-size: 15px; }
.schools { list-style: none; padding: 0; margin: 0 0 28px; border-top: 1px solid var(--line); max-width: 520px; }
.schools li { padding: 11px 0; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; gap: 12px; }
.schools li span:last-child { color: var(--muted); font-size: 14px; text-align: right; }
.h4 { font: 600 13px var(--font-body); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); margin: 0 0 10px; }

/* Le studio */
.about { display: grid; grid-template-columns: 1fr 1fr; gap: 40px; align-items: start; }
.about p { color: var(--muted); margin: 0 0 14px; max-width: 56ch; }
.facts { list-style: none; padding: 0; margin: 0; border-top: 1px solid var(--line); }
.facts li { display: flex; justify-content: space-between; gap: 16px; padding: 14px 0; border-bottom: 1px solid var(--line); }
.facts li span:first-child { color: var(--muted); }
.facts li span:last-child { font-weight: 600; text-align: right; }

/* Contact */
.contact-card { background: var(--brand); color: var(--brand-ink); border-radius: 22px; padding: 36px; display: flex; flex-direction: column; gap: 18px; align-items: flex-start; max-width: 620px; }
.contact-card p { margin: 0; opacity: .92; }
.contact-card code { font: 600 clamp(15px, 3.6vw, 20px) var(--font-body); background: rgba(255,255,255,.16); padding: 12px 18px; border-radius: 12px; user-select: all; word-break: break-all; }
.contact-card button { background: var(--sun); color: var(--sun-ink); border: 0; border-radius: 10px; font: 600 15px var(--font-body); padding: 10px 16px; cursor: pointer; }

footer { border-top: 1px solid var(--line); padding-block: 24px 36px; display: flex; flex-wrap: wrap; gap: 12px 24px; justify-content: space-between; color: var(--muted); font-size: 14px; }
footer nav { display: flex; gap: 18px; flex-wrap: wrap; }
footer a { color: var(--muted); }

@media (max-width: 760px) {
  .hero, .about { grid-template-columns: 1fr; }
  .detail { grid-template-columns: 1fr; gap: 22px; }
  .detail .big svg { max-width: 120px; border-radius: 28px; }
  .feat { grid-template-columns: 1fr; }
  .board { margin: 0; max-width: 320px; }
  .contact-card { padding: 24px; }
  .view { padding-block: 28px 40px; }
}
</style>

    privacy: "Privacy policy", delete: "Data deletion"
  }
};
var lang = "fr";

function setLang(l) {
  lang = l;
  var d = T[l];
  document.documentElement.lang = l;
  document.querySelectorAll("[data-i]").forEach(function (e) { e.textContent = d[e.getAttribute("data-i")]; });
  document.querySelectorAll("[data-i-html]").forEach(function (e) { e.innerHTML = d[e.getAttribute("data-i-html")]; });
  document.getElementById("mail").textContent = CONTACT_EMAIL;
  document.getElementById("l-fr").setAttribute("aria-pressed", l === "fr");
  document.getElementById("l-en").setAttribute("aria-pressed", l === "en");
  try { localStorage.setItem("studiom_lang", l); } catch (e) {}
}
document.getElementById("l-fr").onclick = function () { setLang("fr"); };
document.getElementById("l-en").onclick = function () { setLang("en"); };
document.getElementById("copy").onclick = function () {
  var b = this, ok = function () { b.textContent = T[lang].copied; setTimeout(function () { b.textContent = T[lang].copy; }, 1800); };
  try { navigator.clipboard.writeText(CONTACT_EMAIL).then(ok, function () { sel(); }); } catch (e) { sel(); }
  function sel() { var r = document.createRange(); r.selectNodeContents(document.getElementById("mail")); var s = getSelection(); s.removeAllRanges(); s.addRange(r); }
};
var start = "fr";
try { start = localStorage.getItem("studiom_lang") || "fr"; } catch (e) {}
setLang(start);

// Un écran par onglet, selon le #hash. Les fiches de projet gardent l'onglet « Projets » actif.
var views = ["accueil", "projets", "projet-merge-it", "projet-pouls", "studio", "contact"];
function route() {
  var h = (location.hash || "#accueil").slice(1);
  if (views.indexOf(h) < 0) h = "accueil";
  views.forEach(function (v) { document.getElementById("v-" + v).hidden = v !== h; });
  var tab = h.indexOf("projet-") === 0 ? "projets" : h;
  document.querySelectorAll("nav.tabs a[data-tab]").forEach(function (a) {
    if (a.getAttribute("data-tab") === tab) a.setAttribute("aria-current", "page"); else a.removeAttribute("aria-current");
  });
  window.scrollTo(0, 0);
}
window.addEventListener("hashchange", route);
route();

// Plateau décoratif de l'accueil.
var frames = [
  [2,4,0,8, 0,16,32,0, 4,0,64,128, 0,2,0,0],
  [2,4,2,8, 0,16,32,0, 4,0,64,128, 0,0,0,2],
  [2,4,0,8, 2,16,32,0, 4,0,64,128, 0,0,2,0]
];
var board = document.getElementById("board"), fi = 0;
function draw() {
  var f = frames[fi], html = "";
  for (var i = 0; i < 16; i++) html += '<div class="cell' + (f[i] ? " v" + f[i] : "") + '">' + (f[i] || "") + "</div>";
  board.innerHTML = html;
  var prev = frames[(fi + frames.length - 1) % frames.length];
  board.querySelectorAll(".cell").forEach(function (c, i) { if (f[i] && !prev[i]) c.classList.add("pop"); });
}
draw();
if (!window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
  setInterval(function () { fi = (fi + 1) % frames.length; draw(); }, 1800);
}
</script>
</body>
