<title>Glimmer Maze</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
/* Layout : canvas plein écran, HUD flottant en haut, interrupteur de lampe en bas à droite, écrans centrés par-dessus */
:root{
  --void:#07070b;      /* le noir du labyrinthe */
  --stone:#3a3744;     /* sol */
  --wall:#7a7488;      /* murs */
  --lamp:#ffc56b;      /* lumière du joueur */
  --hunter:#ff5a45;    /* lumière des chasseurs */
  --exit:#4fe0a6;      /* sortie */
  --ink:#ecebf2;
  --muted:#9a98a8;
  --panel:rgba(14,13,20,.92);
  --display:'Unbounded',system-ui,sans-serif;
  --body:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%;margin:0;background:var(--void);color:var(--ink);font-family:var(--body);overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
#game{position:fixed;inset:0;width:100%;height:100%;display:block}
#hud{position:fixed;top:calc(env(safe-area-inset-top,0px) + 12px);left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px));display:flex;justify-content:space-between;align-items:center;gap:12px;pointer-events:none;font-size:12px;letter-spacing:.08em;text-transform:uppercase;font-variant-numeric:tabular-nums}
#hud .lvl{font-family:var(--display);font-weight:500;letter-spacing:.04em}
#hud .time{color:var(--muted);margin-left:8px}
#alert{position:absolute;left:50%;top:54px;translate:-50% 0;white-space:nowrap;font-family:var(--display);font-weight:800;color:var(--hunter);opacity:0;transition:opacity .2s}
#alert.on{opacity:1;animation:pulse .6s ease-in-out infinite alternate}
@keyframes pulse{from{scale:1}to{scale:1.08}}
.bat{display:flex;align-items:center;gap:8px}
.bat-bar{width:64px;height:8px;border:1px solid var(--muted);border-radius:2px;padding:1px}
.bat-fill{height:100%;background:var(--lamp);border-radius:1px;transition:background .2s}
.bat-fill.low{background:var(--hunter)}
#lampBtn{position:fixed;bottom:calc(env(safe-area-inset-bottom,0px) + 28px);right:max(16px,env(safe-area-inset-right,0px));width:92px;height:46px;padding:0;border-radius:999px;border:2px solid #34333d;background:#1f1e26;box-shadow:inset 0 2px 6px rgba(0,0,0,.6);cursor:pointer;touch-action:none;transition:background .2s,border-color .2s}
#lampBtn .knob{position:absolute;top:3px;left:3px;width:36px;height:36px;border-radius:50%;background:var(--lamp);color:#1a1408;display:flex;align-items:center;justify-content:center;box-shadow:0 0 16px rgba(255,197,107,.7);transform:translateX(46px);transition:transform .18s ease,background .2s,box-shadow .2s,color .2s}
#lampBtn .knob svg{width:20px;height:20px}
#lampBtn:not(.off){background:rgba(255,197,107,.18);border-color:rgba(255,197,107,.55)}
#lampBtn.off .knob{background:#44434d;color:#f2f1f6;box-shadow:0 2px 6px rgba(0,0,0,.5);transform:translateX(0)}
@media (prefers-reduced-motion:reduce){#lampBtn .knob{transition:none}}
#lampBtn:focus-visible,#screen button:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
#screen{position:fixed;inset:0;display:flex;justify-content:center;overflow-y:auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:radial-gradient(ellipse at 50% 40%,rgba(255,197,107,.10),rgba(7,7,11,.88) 60%)}
.panel{max-width:420px;width:100%;margin-block:auto;padding-block:28px;display:flex;flex-direction:column;gap:16px;text-align:left}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.levels{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:8px}
.stars{font:400 12px var(--body);letter-spacing:.1em;color:var(--lamp)}
.stars .no,.big-stars .no{color:#34333d}
.big-stars{font-size:40px;letter-spacing:.12em;line-height:1;color:var(--lamp)}
.checks{list-style:none;margin:0;padding:0;display:grid;gap:6px;font-size:14px}
.checks li{display:flex;gap:10px;align-items:baseline}
.checks .ok{color:var(--exit)}
.checks .ko{color:var(--muted)}
.shards{color:#9fe8ff;font-weight:600;font-variant-numeric:tabular-nums}
.shop{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.shop li{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:12px;background:#17161d;border:1.5px solid #2c2b35}
.shop li.on{border-color:var(--lamp)}
.swatch{width:26px;height:26px;border-radius:50%;flex:none}
.shop .name{flex:1;min-width:0;font-weight:600}
details{font-size:13px;color:var(--muted)}
summary{cursor:pointer;color:var(--ink);font-weight:600}
details .rules{margin-top:10px}
.panel h1{font-family:var(--display);font-weight:800;font-size:clamp(40px,12vw,64px);line-height:1;margin:0;letter-spacing:-.02em;text-wrap:balance;color:var(--lamp);text-shadow:0 0 28px rgba(255,197,107,.35)}
.panel h1.lose{color:var(--hunter);text-shadow:0 0 28px rgba(255,90,69,.35)}
.panel h1.win{color:var(--exit);text-shadow:0 0 28px rgba(79,224,166,.35)}
.panel p{margin:0;line-height:1.55;color:var(--ink);font-size:15px}
.panel .muted{color:var(--muted);font-size:13px}
.rules{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:13px;color:var(--muted);margin:0}
.rules dt{color:var(--ink);font-weight:600}
.rules dd{margin:0}
#screen button{align-self:flex-start;font:800 15px var(--display);letter-spacing:.04em;padding:14px 26px;border-radius:999px;border:0;background:var(--lamp);color:#1a1408;cursor:pointer}
#screen button.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--muted);font-size:13px;padding:11px 20px}
#screen .levels button{align-self:stretch;padding:10px 4px 8px;border-radius:12px;background:#17161d;color:var(--ink);border:1.5px solid #2c2b35;display:flex;flex-direction:column;align-items:center;gap:4px;font:800 16px var(--display)}
#screen .levels button.cur{border-color:var(--lamp)}
.cs{font:600 10px var(--body);color:#9fe8ff;letter-spacing:.02em;font-variant-numeric:tabular-nums}
#screen .shop button{padding:8px 14px;font-size:12px}
#screen .shop button:disabled{opacity:.45;cursor:default}
.tabs,.langs{display:flex;flex-wrap:wrap;gap:6px}
#screen .tabs button,#screen .langs button{padding:8px 14px;font-size:12px;background:transparent;color:var(--muted);border:1.5px solid #2c2b35}
#screen .langs button{padding:6px 10px;font:600 12px var(--body);letter-spacing:.06em}
#screen .tabs button[aria-pressed="true"],#screen .langs button[aria-pressed="true"]{color:var(--ink);border-color:var(--lamp)}
.pv{width:34px;height:34px;flex:none;border-radius:50%;background:#0d0c12}
.ic{display:inline-flex;align-items:center;gap:6px}
.ic svg{width:15px;height:15px;flex:none}
.langlist{display:grid;gap:8px}
#screen .langlist button{align-self:stretch;width:100%;display:flex;justify-content:space-between;align-items:center;text-align:left;background:#17161d;color:var(--ink);border:1.5px solid #2c2b35;border-radius:12px;font:600 16px var(--body);letter-spacing:0;padding:14px 16px}
#screen .langlist button[aria-pressed="true"]{border-color:var(--lamp)}
.langlist .code{font:600 11px var(--body);letter-spacing:.08em;color:var(--muted)}
#hud .info{display:flex;align-items:center;min-width:0}
#hud .info span,#hud .bat span{white-space:nowrap}
@media (max-width:380px){#batLabel{display:none}#hud .time,#hud .hs{margin-left:6px}#hud{gap:8px}}
#pauseBtn{pointer-events:auto;flex:none;width:34px;height:34px;margin-right:10px;padding:0;border-radius:50%;border:1.5px solid #34333d;background:rgba(14,13,20,.7);display:inline-flex;align-items:center;justify-content:center;gap:4px;cursor:pointer;touch-action:none}
#pauseBtn span{width:4px;height:12px;border-radius:1px;background:var(--ink)}
#pauseBtn:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
#snack{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 32px);translate:-50% 0;max-width:calc(100% - 32px);box-sizing:border-box;padding:10px 16px;border-radius:999px;background:rgba(14,13,20,.94);border:1px solid #2c2b35;font-size:13px;color:var(--ink);pointer-events:none;z-index:5;text-align:center}
.ann{position:relative;border:1px solid var(--lamp);background:rgba(255,197,107,.08);border-radius:12px;padding:12px 44px 12px 14px}
.ann p{margin:0;font-size:14px;line-height:1.5}
#screen .ann-x{position:absolute;top:6px;right:6px;padding:4px 12px;background:transparent;color:var(--ink);font:400 22px/1 var(--body)}
#splash{position:fixed;inset:0;z-index:20;background:var(--void);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:24px;transition:opacity .5s ease}
#splash.out{opacity:0;pointer-events:none}
#splash img{width:min(62vw,280px);height:auto;animation:splashIn .9s ease-out both}
#splash p{margin:0;font:500 13px var(--display);letter-spacing:.32em;text-transform:uppercase;color:var(--muted);animation:splashIn .9s .25s ease-out both}
#splash .sbar{width:120px;height:3px;border-radius:2px;background:rgba(154,152,168,.2);overflow:hidden}
#splash .sbar i{display:block;height:100%;width:40%;background:#64b5f6;border-radius:2px;animation:sload 1.1s ease-in-out infinite}
@keyframes splashIn{from{opacity:0;transform:translateY(8px) scale(.97)}to{opacity:1;transform:none}}
@keyframes sload{0%{transform:translateX(-100%)}100%{transform:translateX(250%)}}
@media (prefers-reduced-motion:reduce){#splash img,#splash p,#splash .sbar i{animation:none}}
#hud .hs{color:#9fe8ff;margin-left:8px}
#hud .time.late{text-decoration:line-through}
#tip{position:fixed;top:calc(env(safe-area-inset-top,0px) + 80px);left:50%;translate:-50% 0;width:min(360px,calc(100% - 32px));box-sizing:border-box;padding:12px 14px;border-radius:14px;background:rgba(14,13,20,.9);border:1px solid #2c2b35;pointer-events:none;display:flex;flex-direction:column;gap:4px;transition:border-color .2s}
#tip.warn{border-color:var(--hunter)}
#tip.good{border-color:var(--exit)}
#tipStep{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
#tipText{margin:0;font-size:14px;line-height:1.45}
#lampBtn.hint{animation:hint 1.1s ease-out infinite}
@keyframes hint{from{box-shadow:0 0 0 0 rgba(236,235,242,.75)}to{box-shadow:0 0 0 18px rgba(236,235,242,0)}}
@media (prefers-reduced-motion:reduce){#alert.on{animation:none}#lampBtn.hint{animation:none;outline:2px solid var(--ink);outline-offset:4px}}
</style>
</head>

    $('lampBtn').setAttribute('aria-label', t('lamp'));
    $('pauseBtn').setAttribute('aria-label', t('pause'));
    cvs.setAttribute('aria-label', t('maze'));
  }
  // ---------- Studiom (Firebase) : réglages à distance, annonce, statistiques anonymes ----------
  // Inactif dans l'aperçu Claude et tant que la configuration Firebase est vide.
  const FBX = window.StudiomFB && window.StudiomFB.enabled ? window.StudiomFB : null;
  const RC = { starBonus: 5, batDrain: 2.6, batRecharge: 3.5, hunterSpeed: 1, revealBase: 4 };
  const lsGet = k => { try { return JSON.parse(localStorage.getItem(k) || 'null'); } catch (e) { return null; } };
  const lsSet = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} };
  function applyRC(c) {
    if (!c) return;
    const lim = { starBonus: [0, 100], batDrain: [0.5, 10], batRecharge: [0.5, 20], hunterSpeed: [0.5, 1.5], revealBase: [1.5, 10] };
    for (const k in lim) if (typeof c[k] === 'number' && isFinite(c[k])) RC[k] = Math.min(lim[k][1], Math.max(lim[k][0], c[k]));
    if (c.prices) for (const cat of Object.values(CATALOG)) for (const it of cat) {
      if (it.base === undefined) it.base = it.price;
      const v = c.prices[it.id];
      if (it.base > 0 && typeof v === 'number' && isFinite(v)) it.price = Math.max(1, Math.round(v));
    }
  }
  applyRC(lsGet('gm-rc'));
  if (FBX) FBX.get('glimmer/config').then(c => { if (c) { lsSet('gm-rc', c); applyRC(c); } });
  let announce = lsGet('gm-ann');
  const stat = f => { if (FBX) FBX.count('glimmerStats', f); };
  const esc = x => String(x).replace(/[&<>"']/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]));

  const rgba = (hex, a) => `rgba(${parseInt(hex.slice(1, 3), 16)},${parseInt(hex.slice(3, 5), 16)},${parseInt(hex.slice(5, 7), 16)},${a})`;
  let pickups = [], levelShards = 0, levelTotal = 0, spotted = false, par = 60;
  let trail = [], trailT = 0;

  const rnd = n => Math.floor(Math.random() * n);
  const fl = Math.floor;
  const fmt = s => fl(s / 60) + ':' + String(s % 60).padStart(2, '0');
  const isWall = (x, y) => x < 0 || y < 0 || x >= gw || y >= gh || grid[y][x] === 1;

  // ---------- Labyrinthe ----------
  function genMaze(cw, ch) {
    gw = cw * 2 + 1; gh = ch * 2 + 1;
    grid = Array.from({ length: gh }, () => new Uint8Array(gw).fill(1));
    const seen = Array.from({ length: ch }, () => new Uint8Array(cw));
    const stack = [[0, 0]]; seen[0][0] = 1; grid[1][1] = 0;
    while (stack.length) {
      const [cx, cy] = stack[stack.length - 1];
      const opts = DIRS.filter(([dx, dy]) => {
        const nx = cx + dx, ny = cy + dy;
        return nx >= 0 && ny >= 0 && nx < cw && ny < ch && !seen[ny][nx];
      });
      if (!opts.length) { stack.pop(); continue; }
      const [dx, dy] = opts[rnd(opts.length)];
      const nx = cx + dx, ny = cy + dy;
      seen[ny][nx] = 1;
      grid[cy * 2 + 1 + dy][cx * 2 + 1 + dx] = 0;
      grid[ny * 2 + 1][nx * 2 + 1] = 0;
      stack.push([nx, ny]);
    }
    // Quelques boucles pour pouvoir semer les chasseurs
    let loops = Math.floor(cw * ch * 0.12), guard = 0;
    while (loops > 0 && guard++ < 5000) {
      const x = 1 + rnd(gw - 2), y = 1 + rnd(gh - 2);
      if (grid[y][x] !== 1) continue;
      const between = (x % 2 === 0 && y % 2 === 1) || (x % 2 === 1 && y % 2 === 0);
      if (!between) continue;
      grid[y][x] = 0; loops--;
    }
  }

  function bfs(sx, sy) {
    const d = new Int32Array(gw * gh).fill(-1), prev = new Int32Array(gw * gh).fill(-1);
    const q = [sy * gw + sx]; d[q[0]] = 0;
    for (let i = 0; i < q.length; i++) {
      const c = q[i], x = c % gw, y = (c / gw) | 0;
      for (const [dx, dy] of DIRS) {
        const nx = x + dx, ny = y + dy;
        if (isWall(nx, ny)) continue;
        const n = ny * gw + nx;
        if (d[n] >= 0) continue;
        d[n] = d[c] + 1; prev[n] = c; q.push(n);
      }
    }
    return { d, prev };
  }
  function findPath(sx, sy, tx, ty) {
    if (isWall(tx, ty)) return [];
    const { d, prev } = bfs(sx, sy);
    let c = ty * gw + tx;
    if (d[c] < 0) return [];
    const out = [], start = sy * gw + sx;
    while (c !== start && c >= 0) { out.push(c); c = prev[c]; }
    out.reverse();
    return out.map(c => ({ x: c % gw + 0.5, y: ((c / gw) | 0) + 0.5 }));
  }

  // ---------- Géométrie ----------
  function castRay(ox, oy, a, max) {
    const dx = Math.cos(a), dy = Math.sin(a);
    let mx = fl(ox), my = fl(oy);
    const ddx = Math.abs(1 / dx), ddy = Math.abs(1 / dy);
    let sx, sy, sdx, sdy;
    if (dx < 0) { sx = -1; sdx = (ox - mx) * ddx; } else { sx = 1; sdx = (mx + 1 - ox) * ddx; }
    if (dy < 0) { sy = -1; sdy = (oy - my) * ddy; } else { sy = 1; sdy = (my + 1 - oy) * ddy; }
    let d = 0;
    while (d < max) {
      if (sdx < sdy) { d = sdx; sdx += ddx; mx += sx; } else { d = sdy; sdy += ddy; my += sy; }
      if (isWall(mx, my)) return Math.min(d, max);
    }
    return max;
  }
  function los(ax, ay, bx, by) {
    const d = Math.hypot(bx - ax, by - ay);
    if (d < 1e-4) return true;
    return castRay(ax, ay, Math.atan2(by - ay, bx - ax), d) >= d - 0.02;
  }
  function angDiff(a, b) {
    let d = (a - b) % (Math.PI * 2);
    if (d > Math.PI) d -= Math.PI * 2;
    if (d < -Math.PI) d += Math.PI * 2;
    return d;
  }
  const turn = (a, target, k) => a + angDiff(target, a) * k;

  function collides(x, y, r) {
    for (let ty = fl(y - r); ty <= fl(y + r); ty++)
      for (let tx = fl(x - r); tx <= fl(x + r); tx++)
        if (isWall(tx, ty)) {
          const cx = Math.max(tx, Math.min(x, tx + 1)), cy = Math.max(ty, Math.min(y, ty + 1));
          if ((x - cx) ** 2 + (y - cy) ** 2 < r * r) return true;
        }
    return false;
  }
  function move(e, dx, dy) {
    e.x += dx; if (collides(e.x, e.y, R)) e.x -= dx;
    e.y += dy; if (collides(e.x, e.y, R)) e.y -= dy;
  }

  // ---------- Niveau ----------
  function shardQuota(n) { return Math.min(3 + n, 10); } // éclats disponibles au total dans un niveau
  function hunterCount() { return Math.min(1 + Math.floor(level / 2), 5); }
  function patrolSpeed() { return (1.4 + 0.08 * level) * RC.hunterSpeed; }
  function chaseSpeed() { return Math.min(2.4 + 0.12 * level, 3.5) * RC.hunterSpeed; }

  function startLevel() {
    view = 'game';
    tutorial = false; $('tip').hidden = true; lampBtn.classList.remove('hint');
    const size = Math.min(7 + level * 2, 19);
    genMaze(size, size);
    player = { x: 1.5, y: 1.5, a: isWall(2, 1) ? Math.PI / 2 : 0, lamp: true, bat: 100 };
    const { d } = bfs(1, 1);
    let far = 0, ex = 0;
    for (let i = 0; i < d.length; i++) if (d[i] > far) { far = d[i]; ex = i; }
    // Sortie : loin en chemin (au moins 75 % du max) ET loin à l'écran
    let bestScore = -1;
    for (let i = 0; i < d.length; i++) {
      if (d[i] < far * 0.75) continue;
      const score = Math.hypot(i % gw - 1, ((i / gw) | 0) - 1);
      if (score > bestScore) { bestScore = score; ex = i; }
    }
    far = d[ex];
    exit = { x: ex % gw, y: (ex / gw) | 0 };
    // Chasseurs : loin du départ, en chemin ET à vol d'oiseau
    const cands = [];
    for (let i = 0; i < d.length; i++) if (d[i] > far * 0.55 && i !== ex && Math.hypot(i % gw - 1, ((i / gw) | 0) - 1) >= 7) cands.push(i);
    if (!cands.length) for (let i = 0; i < d.length; i++) if (d[i] > far * 0.4 && i !== ex) cands.push(i);
    hunters = [];
    for (let k = 0; k < hunterCount(); k++) {
      const c = cands[rnd(cands.length)];
      hunters.push({ x: c % gw + 0.5, y: ((c / gw) | 0) + 0.5, a: Math.random() * 6.28, state: 'patrol', path: [], repath: 0, timer: 0, last: null });
    }
    // Objets : éclats (de préférence au fond des impasses) et piles
    const free = [], deadEnds = [];
    for (let i = 0; i < d.length; i++) {
      if (d[i] < 4 || i === ex) continue;
      const x = i % gw, y = (i / gw) | 0;
      if (x % 2 === 0 || y % 2 === 0) continue; // centres de cellules uniquement
      free.push(i);
      if (DIRS.filter(([dx, dy]) => isWall(x + dx, y + dy)).length === 3) deadEnds.push(i);
    }
    const take = list => {
      if (!list.length) return null;
      const c = list.splice(rnd(list.length), 1)[0];
      for (const other of [free, deadEnds]) { const j = other.indexOf(c); if (j >= 0) other.splice(j, 1); }
      return c;
    };
    pickups = [];
    const nShards = Math.max(0, shardQuota(level) - (save.collected[level] || 0)), nBat = level >= 4 ? 2 : 1;
    for (let k = 0; k < nShards; k++) { const c = take(deadEnds.length ? deadEnds : free); if (c !== null) pickups.push({ x: c % gw + 0.5, y: ((c / gw) | 0) + 0.5, type: 'shard' }); }
    for (let k = 0; k < nBat; k++) { const c = take(free); if (c !== null) pickups.push({ x: c % gw + 0.5, y: ((c / gw) | 0) + 0.5, type: 'bat' }); }
    levelShards = 0; levelTotal = pickups.filter(p => p.type === 'shard').length; spotted = false;
    par = Math.ceil(far / P_SPEED * 1.8 + 8); // temps cible pour l'étoile « Rapide »
    time = 0; shake = 0;
    // Aperçu du labyrinthe éclairé : 4 s au niveau 1, puis de moins en moins (min 1,5 s)
    revealT = Math.max(1.5, RC.revealBase - 0.4 * (level - 1)) + REVEAL_ZOOM;
    state = 'reveal';
    $('screen').hidden = true; $('hud').hidden = false; $('lampBtn').hidden = false;
    $('lvl').textContent = t('level', level);
    stat({ ['starts.l' + level]: 1 });
    trail = [];
    $('hudShards').textContent = '◆ 0/' + levelTotal;
    updateLampUI();
  }

  // ---------- Entrées ----------
  const keys = new Set();
  let mouse = null, joy = null;
  addEventListener('keydown', e => {
    keys.add(e.code);
    if (state === 'reveal' && !e.repeat) revealT = Math.min(revealT, REVEAL_ZOOM);
    if ((e.code === 'Space' || e.code === 'KeyE') && !e.repeat && state === 'play') { toggleLamp(); e.preventDefault(); }
    if ((e.code === 'Escape' || e.code === 'KeyP') && state === 'play') pause();
    if (e.code === 'Enter' && state !== 'play') { const b = $('panel').querySelector('button'); if (b) b.click(); }
  });
  addEventListener('keyup', e => keys.delete(e.code));
  addEventListener('blur', () => { keys.clear(); joy = null; if (state === 'play') pause(); });
  document.addEventListener('visibilitychange', () => { if (document.hidden && state === 'play') pause(); });

  cvs.addEventListener('pointermove', e => {
    if (e.pointerType === 'mouse') mouse = { x: e.clientX, y: e.clientY };
    if (joy && e.pointerId === joy.id) { joy.x = e.clientX; joy.y = e.clientY; }
  });
  cvs.addEventListener('pointerdown', e => {
    if (state === 'reveal') revealT = Math.min(revealT, REVEAL_ZOOM);
    if (e.pointerType === 'mouse' || joy) return;
    joy = { id: e.pointerId, ox: e.clientX, oy: e.clientY, x: e.clientX, y: e.clientY };
    try { cvs.setPointerCapture(e.pointerId); } catch (_) {}
  });
  const endJoy = e => { if (joy && e.pointerId === joy.id) joy = null; };
  cvs.addEventListener('pointerup', endJoy);
  cvs.addEventListener('pointercancel', endJoy);

  const lampBtn = $('lampBtn');
  lampBtn.addEventListener('pointerdown', e => { e.stopPropagation(); e.preventDefault(); if (state === 'play') toggleLamp(); });
  lampBtn.addEventListener('click', e => { if (e.detail === 0 && state === 'play') toggleLamp(); }); // clavier

  $('pauseBtn').addEventListener('pointerdown', e => e.stopPropagation());
  $('pauseBtn').addEventListener('click', () => { if (state === 'play' || state === 'reveal') pause(); });

  // Bouton Retour du téléphone : on garde une entrée d'historique « tampon » pour l'intercepter.
  // En jeu → pause ; en pause → reprise ; boutique, langues, fin de niveau → menu ; menu → 2e appui pour quitter.
  let backArmed = false, exitUntil = 0, snackTimer = 0;
  function armBack() {
    if (backArmed) return;
    try { history.pushState({ gm: 1 }, ''); backArmed = true; } catch (e) {}
  }
  function snack(text) {
    const el = $('snack'); el.textContent = text; el.hidden = false;
    clearTimeout(snackTimer); snackTimer = setTimeout(() => { el.hidden = true; }, 2000);
  }
  addEventListener('popstate', () => {
    backArmed = false;
    if (state === 'play' || state === 'reveal') pause();
    else if (state === 'pause') resume();
    else if (view !== 'menu') menu();
    else if (performance.now() < exitUntil) { history.back(); return; }
    else { exitUntil = performance.now() + 2000; snack(t('exitHint')); }
    armBack();
  });
  // Chrome ignore les entrées ajoutées sans geste du joueur : on (ré)arme à chaque toucher
  addEventListener('pointerdown', armBack, true);
  addEventListener('keydown', armBack, true);

  function toggleLamp() {
    if (!player.lamp && player.bat < 15) { flashBattery(); return; }
    player.lamp = !player.lamp;
    sfx('lamp');
    updateLampUI();
  }
  function updateLampUI() {
    lampBtn.classList.toggle('off', !player.lamp);
    lampBtn.setAttribute('aria-checked', String(player.lamp));
  }
  let batWarn = 0;
  function flashBattery() { batWarn = 1; }

  function inputVector() {
    let x = 0, y = 0;
    if (keys.has('KeyD') || keys.has('ArrowRight')) x += 1;
    if (keys.has('KeyA') || keys.has('ArrowLeft')) x -= 1;
    if (keys.has('KeyS') || keys.has('ArrowDown')) y += 1;
    if (keys.has('KeyW') || keys.has('ArrowUp')) y -= 1;
    if (joy) {
      const dx = joy.x - joy.ox, dy = joy.y - joy.oy, d = Math.hypot(dx, dy);
      if (d > 8) { const k = Math.min(d, 50) / 50 / d; x = dx * k; y = dy * k; }
    }
    const l = Math.hypot(x, y);
    if (l > 1) { x /= l; y /= l; }
    return { x, y };
  }

  // ---------- Chasseurs ----------
  function hunterSees(h) {
    const dx = player.x - h.x, dy = player.y - h.y, d = Math.hypot(dx, dy);
    if (!los(h.x, h.y, player.x, player.y)) return false;
    if (d < 0.9) return true;                                                          // il t'entend
    if (d < H_RANGE && Math.abs(angDiff(Math.atan2(dy, dx), h.a)) < HALF) return true; // dans son faisceau
    if (player.lamp && d < GLOW_NOTICE) return true;                                   // il voit ta lueur
    if (player.lamp && d < P_RANGE && Math.abs(angDiff(Math.atan2(-dy, -dx), player.a)) < HALF) return true; // tu l'éclaires
    return false;
  }
  function followPath(h, speed, dt, faceAngle) {
    const t = h.path[0];
    if (!t) return;
    const dx = t.x - h.x, dy = t.y - h.y, d = Math.hypot(dx, dy);
    if (d < 0.08) { h.path.shift(); return; }
    const step = Math.min(speed * dt, d);
    move(h, dx / d * step, dy / d * step);
    h.a = turn(h.a, faceAngle ?? Math.atan2(dy, dx), 1 - Math.exp(-dt * 8));
  }
  function updateHunter(h, dt) {
    const sees = hunterSees(h);
    if (sees) {
      if (h.state !== 'chase') { if (alertFlash < 0.3) sfx('spotted'); alertFlash = 1; spotted = true; try { navigator.vibrate && navigator.vibrate(70); } catch (_) {} }
      h.state = 'chase'; h.last = { x: player.x, y: player.y };
    }
    if (h.state === 'chase') {
      const toPlayer = Math.atan2(player.y - h.y, player.x - h.x);
      h.repath -= dt;
      if (h.repath <= 0) { h.repath = 0.25; h.path = findPath(fl(h.x), fl(h.y), fl(h.last.x), fl(h.last.y)); }
      if (sees && Math.hypot(player.x - h.x, player.y - h.y) < 1.4) {
        const dx = player.x - h.x, dy = player.y - h.y, d = Math.hypot(dx, dy) || 1;
        move(h, dx / d * chaseSpeed() * dt, dy / d * chaseSpeed() * dt);
        h.a = turn(h.a, toPlayer, 1 - Math.exp(-dt * 10));
      } else {
        followPath(h, chaseSpeed(), dt, sees ? toPlayer : undefined);
      }
      if (!sees && !h.path.length && h.repath < 0.2) { h.state = 'search'; h.timer = 3.5; }
    } else if (h.state === 'search') {
      h.a += dt * 2.2;
      h.timer -= dt;
      if (h.timer <= 0) { h.state = 'patrol'; h.path = []; }
    } else {
      if (!h.path.length && h.route) {
        const rp = h.route[h.ri]; h.ri = (h.ri + 1) % h.route.length;
        h.path = findPath(fl(h.x), fl(h.y), fl(rp.x), fl(rp.y));
      }
      if (!h.path.length) {
        for (let i = 0; i < 30; i++) {
          const x = 1 + rnd(gw - 2), y = 1 + rnd(gh - 2);
          if (!isWall(x, y)) { h.path = findPath(fl(h.x), fl(h.y), x, y); break; }
        }
      }
      followPath(h, patrolSpeed(), dt);
    }
  }

  // ---------- Boucle ----------
  function update(dt) {
    time += dt;
    const v = inputVector();
    move(player, v.x * P_SPEED * dt, v.y * P_SPEED * dt);
    let aim = null;
    if (mouse) aim = Math.atan2(mouse.y - H / 2, mouse.x - W / 2);
    else if (v.x || v.y) aim = Math.atan2(v.y, v.x);
    if (aim !== null) player.a = turn(player.a, aim, 1 - Math.exp(-dt * 14));

    // Traînée (décorative, visible seulement dans la lumière)
    if (save.trail !== 'tr-aucune' && (v.x || v.y)) {
      trailT -= dt;
      if (trailT <= 0) {
        trailT = 0.08;
        trail.push({ x: player.x - Math.cos(player.a) * 0.25 + (Math.random() - 0.5) * 0.2, y: player.y - Math.sin(player.a) * 0.25 + (Math.random() - 0.5) * 0.2, t: time, r: Math.random() * 6 });
      }
    }
    while (trail.length && time - trail[0].t > 2.5) trail.shift();

    if (player.lamp) {
      player.bat -= RC.batDrain * dt;
      if (player.bat <= 0) { player.bat = 0; player.lamp = false; updateLampUI(); flashBattery(); }
    } else player.bat = Math.min(100, player.bat + RC.batRecharge * dt);

    for (const p of pickups) {
      if (p.taken || Math.hypot(p.x - player.x, p.y - player.y) > 0.55) continue;
      p.taken = true;
      if (p.type === 'shard') { sfx('shard'); levelShards++; $('hudShards').textContent = '◆ ' + levelShards + '/' + levelTotal; }
      else { sfx('bat'); player.bat = Math.min(100, player.bat + 40); if (tutorial) toast(t('pileToast'), 'good'); }
      try { navigator.vibrate && navigator.vibrate(20); } catch (_) {}
    }

    for (const h of hunters) {
      updateHunter(h, dt);
      if (Math.hypot(h.x - player.x, h.y - player.y) < 0.55) return tutorial ? tutorialCaught() : lose();
    }
    if (fl(player.x) === exit.x && fl(player.y) === exit.y) return tutorial ? tutorialDone() : win();

    shake = Math.max(0, shake - dt * 3);
    alertFlash = Math.max(0, alertFlash - dt * 2);
    batWarn = Math.max(0, batWarn - dt * 2);

    // HUD
    const s = fl(time);
    $('time').textContent = tutorial ? fmt(s) : fmt(s) + ' / ' + fmt(par);
    $('time').classList.toggle('late', time > par);
    const chasing = hunters.some(h => h.state === 'chase');
    $('alert').classList.toggle('on', chasing);
    let nearest = Infinity;
    for (const h of hunters) nearest = Math.min(nearest, Math.hypot(h.x - player.x, h.y - player.y));
    tensionTarget = chasing ? 1 : Math.max(0, 1 - nearest / 6) * 0.6;
    const fill = $('batFill');
    fill.style.width = player.bat.toFixed(0) + '%';
    fill.classList.toggle('low', player.bat < 20 || batWarn > 0);
    if (tutorial) tutorialUpdate(dt);
  }

  function starHTML(n) { let h = ''; for (let i = 0; i < 3; i++) h += i < n ? '★' : '<span class="no">★</span>'; return h; }

  function win() {
    state = 'over';
    sfx('win');
    const fast = time <= par, stealth = !spotted;
    const got = 1 + (stealth ? 1 : 0) + (fast ? 1 : 0);
    const before = save.stars[level] || 0;
    const bonus = Math.max(0, got - before) * RC.starBonus;
    save.stars[level] = Math.max(before, got);
    save.shards += levelShards + bonus;
    save.collected[level] = (save.collected[level] || 0) + levelShards;
    const left = Math.max(0, shardQuota(level) - save.collected[level]);
    const done = level;
    level++;
    save.unlocked = Math.max(save.unlocked, level);
    persist();
    stat(Object.assign({ ['wins.l' + done]: 1 }, got === 3 ? { ['stars3.l' + done]: 1 } : {}));
    showScreen(`
      <h1 class="win">${t('winTitle')}</h1>
      <div class="big-stars" aria-label="${t('starsAria', got)}">${starHTML(got)}</div>
      <ul class="checks">
        <li><span class="ok">✓</span>${t('exitFound')}</li>
        <li><span class="${stealth ? 'ok">✓' : 'ko">✗'}</span>${t('stealth')}</li>

      c.restore();
    } else {
      if (id === 'sk-fantome') { c.shadowColor = 'rgba(220,225,255,0.9)'; c.shadowBlur = r * 1.2; }
      c.fillStyle = body; c.beginPath(); c.arc(x, y, r, 0, Math.PI * 2); c.fill();
      c.shadowBlur = 0;
    }
    if (id === 'sk-renard') { const m = at(0, 0.55); c.fillStyle = '#fff1e3'; c.beginPath(); c.arc(m[0], m[1], r * 0.42, 0, Math.PI * 2); c.fill(); }
    if (id === 'sk-chat' || id === 'sk-fantome') {
      c.fillStyle = id === 'sk-chat' ? '#d9f56b' : '#2b2a35';
      for (const s of [-1, 1]) { const e = at(s * 0.75, 0.5); c.beginPath(); c.arc(e[0], e[1], r * 0.16, 0, Math.PI * 2); c.fill(); }
    }
  }
  // Particules de traînée (boutique)
  function drawParticle(c, kind, x, y, s, al, rot) {
    c.globalAlpha = Math.max(0, Math.min(1, al));
    if (kind === 'tr-poussiere') { c.fillStyle = '#c9c3b6'; c.beginPath(); c.arc(x, y, s, 0, Math.PI * 2); c.fill(); }
    else if (kind === 'tr-etincelles') { c.fillStyle = C.lamp; c.save(); c.translate(x, y); c.rotate(rot); c.fillRect(-s, -s * 0.25, 2 * s, s * 0.5); c.fillRect(-s * 0.25, -s, s * 0.5, 2 * s); c.restore(); }
    else if (kind === 'tr-petales') { c.fillStyle = '#ff9ad5'; c.beginPath(); c.ellipse(x, y, s * 1.2, s * 0.6, rot, 0, Math.PI * 2); c.fill(); }
    else if (kind === 'tr-etoiles') {
      c.fillStyle = '#fff3b0'; c.beginPath();
      for (let i = 0; i < 10; i++) { const rr = i % 2 ? s * 0.45 : s * 1.2, an = rot + i * Math.PI / 5; c.lineTo(x + Math.cos(an) * rr, y + Math.sin(an) * rr); }
      c.closePath(); c.fill();
    }
    c.globalAlpha = 1;
  }

  function render(now) {
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    ctx.fillStyle = C.void; ctx.fillRect(0, 0, W, H);
    if (!grid) return;

    // k = 0 : vue d'ensemble éclairée, k = 1 : vue normale centrée sur le joueur
    let k = 1;
    if (state === 'reveal') { const u = Math.min(1, Math.max(0, 1 - revealT / REVEAL_ZOOM)); k = u * u * (3 - 2 * u); }
    const fit = Math.min((W - 32) / gw, (H - 200) / gh);
    T = fit + (T0 - fit) * k;
    const ccx = gw / 2 + (player.x - gw / 2) * k, ccy = gh / 2 + (player.y - gh / 2) * k;
    const sh = shake * 8;
    camX = ccx * T - W / 2 + (Math.random() - 0.5) * sh;
    camY = ccy * T - H / 2 + (Math.random() - 0.5) * sh;

    // Sol et murs
    const x0 = Math.max(0, fl(camX / T)), x1 = Math.min(gw - 1, fl((camX + W) / T));
    const y0 = Math.max(0, fl(camY / T)), y1 = Math.min(gh - 1, fl((camY + H) / T));
    for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) {
      const px = sx(x), py = sy(y);
      if (grid[y][x] === 1) {
        ctx.fillStyle = C.wall; ctx.fillRect(px, py, T + 0.5, T + 0.5);
        if (!isWall(x, y + 1)) { ctx.fillStyle = C.wallTop; ctx.fillRect(px, py + T * 0.78, T + 0.5, T * 0.22); }
      } else {
        ctx.fillStyle = (x + y) % 2 ? C.stone : C.stone2; ctx.fillRect(px, py, T + 0.5, T + 0.5);
      }
    }
    // Sortie
    const pulse = 0.6 + 0.4 * Math.sin(now / 300);
    ctx.fillStyle = C.exit; ctx.globalAlpha = 0.35 + 0.35 * pulse;
    ctx.fillRect(sx(exit.x) + T * 0.1, sy(exit.y) + T * 0.1, T * 0.8, T * 0.8);
    ctx.globalAlpha = 1;
    ctx.strokeStyle = C.exit; ctx.lineWidth = 2;
    ctx.strokeRect(sx(exit.x) + T * 0.1, sy(exit.y) + T * 0.1, T * 0.8, T * 0.8);

    // Objets
    for (const p of pickups) {
      if (p.taken) continue;
      const px = sx(p.x), py = sy(p.y) + Math.sin(now / 250 + p.x * 3) * T * 0.05;
      if (p.type === 'shard') {
        const r = T * 0.17;
        ctx.fillStyle = '#9fe8ff';
        ctx.beginPath(); ctx.moveTo(px, py - r * 1.4); ctx.lineTo(px + r, py); ctx.lineTo(px, py + r * 1.4); ctx.lineTo(px - r, py); ctx.closePath(); ctx.fill();
      } else {
        ctx.fillStyle = '#d9d4c4'; ctx.fillRect(px - T * 0.06, py - T * 0.25, T * 0.12, T * 0.05);
        ctx.fillStyle = C.lamp; ctx.fillRect(px - T * 0.13, py - T * 0.2, T * 0.26, T * 0.4);
      }
    }

    // Traînée
    for (const q of trail) {
      const age = time - q.t;
      drawParticle(ctx, save.trail, sx(q.x), sy(q.y), T * 0.06 * (1 + age * 0.3), 1 - age / 2.5, q.r + age);
    }

    // Chasseurs
    for (const h of hunters) {
      ctx.fillStyle = '#2a0f0c'; ctx.beginPath(); ctx.arc(sx(h.x), sy(h.y), R * T, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = C.hunter; ctx.lineWidth = 2; ctx.stroke();
      ctx.fillStyle = C.hunter;
      ctx.beginPath(); ctx.arc(sx(h.x + Math.cos(h.a) * R * 0.55), sy(h.y + Math.sin(h.a) * R * 0.55), R * T * 0.28, 0, Math.PI * 2); ctx.fill();
    }
    // Joueur
    drawSkin(ctx, sx(player.x), sy(player.y), R * T, player.a, save.skin);
    ctx.fillStyle = player.lamp ? C.lamp : '#6d6a78';
    ctx.beginPath(); ctx.arc(sx(player.x + Math.cos(player.a) * R * 0.6), sy(player.y + Math.sin(player.a) * R * 0.6), R * T * 0.3, 0, Math.PI * 2); ctx.fill();

    // Obscurité
    dctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    dctx.globalCompositeOperation = 'source-over';
    dctx.clearRect(0, 0, W, H);
    dctx.fillStyle = 'rgba(3,3,6,0.995)'; dctx.fillRect(0, 0, W, H);
    dctx.globalCompositeOperation = 'destination-out';

    let pCone = null;
    if (player.lamp) {
      const flicker = player.bat < 15 ? 0.75 + Math.random() * 0.25 : 1;
      pCone = cone(player.x, player.y, player.a, P_RANGE * flicker, 56);
      cutCone(player.x, player.y, pCone, P_RANGE * flicker, 1);
      cutCircle(player.x, player.y, 1.3, 0.75);
    } else {
      cutCircle(player.x, player.y, 0.9, 0.45);
    }
    const hCones = hunters.map(h => cone(h.x, h.y, h.a, H_RANGE, 40));
    hunters.forEach((h, i) => { cutCone(h.x, h.y, hCones[i], H_RANGE, 0.9); cutCircle(h.x, h.y, 0.6, 0.55); });
    cutCircle(exit.x + 0.5, exit.y + 0.5, 1.8, 0.55);

    ctx.globalAlpha = k; ctx.drawImage(dark, 0, 0, W, H); ctx.globalAlpha = 1;

    // Teintes de lumière
    if (pCone) { ctx.fillStyle = rgba(C.lamp, 0.16); polyPath(ctx, player.x, player.y, pCone); ctx.fill(); }
    hunters.forEach((h, i) => {
      ctx.fillStyle = h.state === 'chase' ? 'rgba(255,90,69,0.3)' : 'rgba(255,90,69,0.18)';
      polyPath(ctx, h.x, h.y, hCones[i]); ctx.fill();
    });

    // Tutoriel : repère sur l'objectif en cours
    if (tutorial && state === 'play') {
      const tg = tStep === 1 ? { x: 7.5, y: 1.5, c: '#9fe8ff' } : tStep === 3 ? { x: 7.5, y: 6.5, c: C.lamp } : tStep === 4 ? { x: exit.x + 0.5, y: exit.y + 0.5, c: C.exit } : null;
      if (tg) {
        const ph = reduceMotion ? 0.5 : (now / 900) % 1;
        ctx.strokeStyle = tg.c; ctx.lineWidth = 2; ctx.globalAlpha = 1 - ph * 0.8;
        ctx.beginPath(); ctx.arc(sx(tg.x), sy(tg.y), T * (0.35 + ph * 0.45), 0, Math.PI * 2); ctx.stroke();
        ctx.globalAlpha = 1;
      }
    }

    // Danger : vignette rouge selon le chasseur le plus proche
    let near = Infinity;
    for (const h of hunters) near = Math.min(near, Math.hypot(h.x - player.x, h.y - player.y));
    const danger = Math.max(0, 1 - near / 5) * (reduceMotion ? 0.8 : 0.7 + 0.3 * Math.sin(now / 140)) + alertFlash * 0.5;
    if (danger > 0.01) {
      const g = ctx.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.3, W / 2, H / 2, Math.max(W, H) * 0.7);
      g.addColorStop(0, 'rgba(255,90,69,0)'); g.addColorStop(1, `rgba(255,40,30,${Math.min(0.45, danger * 0.4)})`);
      ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
    }

    // Aperçu : repère du joueur + consigne
    if (state === 'reveal' && k < 1) {
      ctx.globalAlpha = 1 - k;
      ctx.strokeStyle = C.lamp; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(sx(player.x), sy(player.y), Math.max(10, T * (0.9 + 0.2 * Math.sin(now / 150))), 0, Math.PI * 2); ctx.stroke();
      ctx.textAlign = 'center';
      ctx.fillStyle = '#ecebf2'; ctx.font = "800 18px Unbounded, system-ui, sans-serif";
      ctx.fillText(t('memorize'), W / 2, 62);
      ctx.fillStyle = '#9a98a8'; ctx.font = "500 13px Inter, system-ui, sans-serif";
      ctx.fillText(t('skip', Math.ceil(Math.max(0, revealT - REVEAL_ZOOM))), W / 2, 84);
      ctx.textAlign = 'start'; ctx.globalAlpha = 1;
    }

    // Joystick
    if (joy) {
      ctx.strokeStyle = 'rgba(236,235,242,0.25)'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(joy.ox, joy.oy, 50, 0, Math.PI * 2); ctx.stroke();
      const dx = joy.x - joy.ox, dy = joy.y - joy.oy, d = Math.hypot(dx, dy), k = d > 50 ? 50 / d : 1;
      ctx.fillStyle = 'rgba(236,235,242,0.3)';
      ctx.beginPath(); ctx.arc(joy.ox + dx * k, joy.oy + dy * k, 20, 0, Math.PI * 2); ctx.fill();
    }
  }

  let last = performance.now();
  function frame(now) {
    const dt = Math.min((now - last) / 1000, 0.05); last = now;
    if (prismOn && (prismAcc += dt) > 0.08) { prismAcc = 0; C.lamp = prismColor(now); document.documentElement.style.setProperty('--lamp', C.lamp); }
    if (state === 'play') update(dt);
    else if (state === 'reveal') { revealT -= dt; if (revealT <= 0) { revealT = 0; state = 'play'; } }
    else shake = Math.max(0, shake - dt * 3);
    tension += ((state === 'play' ? tensionTarget : 0) - tension) * Math.min(1, dt * 2);
    render(now);
    requestAnimationFrame(frame);
  }

  // Écran d'accueil sur un labyrinthe de démo en fond
  genMaze(9, 9);
  player = { x: 1.5, y: 1.5, a: 0.4, lamp: true, bat: 100 };
  exit = { x: gw - 2, y: gh - 2 };
  applyLamp();
  applyLang();
  menu();
  // Écran de chargement « by Studiom » : au moins 1,8 s, le temps de charger les polices (3 s max)
  (function () {
    const el = $('splash'), t0 = performance.now();
    let done = false;
    const hide = () => { if (done) return; done = true; el.classList.add('out'); setTimeout(() => el.remove(), 520); };
    const ready = Promise.race([document.fonts && document.fonts.ready ? document.fonts.ready : Promise.resolve(), new Promise(r => setTimeout(r, 3000))]);
    ready.then(() => setTimeout(hide, Math.max(0, 1800 - (performance.now() - t0))));
    el.addEventListener('pointerdown', e => { e.stopPropagation(); hide(); });
  })();
  stat(Object.assign({ sessions: 1, ['langs.' + lang]: 1 }, FBX && FBX.firstToday('gm') ? { players: 1 } : {}));
  if (FBX) FBX.get('glimmer/announcement').then(a => { announce = a; lsSet('gm-ann', a); if (state === 'menu' && view === 'menu') menu(); });
  requestAnimationFrame(frame);
})();
</script>
